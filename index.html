<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>WebNanz</title>

    <link
        rel="stylesheet"
        href="style.css">


    <style>

        /* =========================================
           MOVABLE LANGUAGE SWITCH
        ========================================= */

        .language-switch {

            position: fixed !important;

            top: 16px !important;
            right: 16px;
            left: auto;

            z-index: 999999 !important;

            display: flex !important;
            align-items: center;

            gap: 5px;

            padding: 5px;

            border:
                1px solid rgba(
                    0,
                    238,
                    255,
                    0.65
                );

            border-radius: 999px;

            background:
                rgba(
                    5,
                    8,
                    24,
                    0.92
                );

            backdrop-filter:
                blur(10px);

            -webkit-backdrop-filter:
                blur(10px);

            box-shadow:
                0 0 12px
                rgba(
                    0,
                    238,
                    255,
                    0.35
                ),

                0 0 22px
                rgba(
                    204,
                    0,
                    255,
                    0.18
                );

        }



        .language-button {

            min-width: 44px;

            border: 0;

            border-radius: 999px;

            padding:
                8px 11px;

            cursor: pointer;

            font:
                inherit;

            font-size:
                12px;

            font-weight:
                800;

            letter-spacing:
                0.08em;

            color:
                #dffcff;

            background:
                transparent;

        }



        .language-button.active {

            color:
                #050818;

            background:
                linear-gradient(
                    135deg,
                    #00f0ff,
                    #d946ef
                );

            box-shadow:
                0 0 12px
                rgba(
                    0,
                    240,
                    255,
                    0.55
                );

        }



        /* DRAG HANDLE */

        .language-move-button {

            width: 32px;
            height: 32px;

            display: flex;
            align-items: center;
            justify-content: center;

            padding: 0;

            border:
                1px solid
                rgba(
                    217,
                    70,
                    239,
                    0.55
                );

            border-radius:
                50%;

            background:
                rgba(
                    255,
                    255,
                    255,
                    0.05
                );

            color:
                #ffffff;

            font-size:
                17px;

            line-height:
                1;

            cursor:
                grab;

            touch-action:
                none;

            user-select:
                none;

            -webkit-user-select:
                none;

        }



        .language-move-button:active {

            cursor:
                grabbing;

        }



        @media (
            max-width: 768px
        ) {

            .language-switch {

                top:
                    10px !important;

                right:
                    10px;

            }


            .language-button {

                min-width:
                    39px;

                padding:
                    7px 9px;

                font-size:
                    11px;

            }


            .language-move-button {

                width:
                    30px;

                height:
                    30px;

            }

        }

    </style>

</head>



<body>



    <!-- =========================================
         LANGUAGE SWITCH
    ========================================== -->

   <div
    class="language-switch notranslate"
    id="languageSwitch"
    role="group"
    aria-label="Language selector"
    translate="no">


        <button
    type="button"
    class="language-button active notranslate"
    id="langEN"
    aria-pressed="true"
    translate="no">
    EN
</button>

        </button>


       <button
    type="button"
    class="language-button notranslate"
    id="langES"
    aria-pressed="false"
    translate="no">
    ES
</button>


        <button
            type="button"
            class="language-move-button"
            id="moveLanguageSwitch"
            aria-label="Move language selector">

            ↔

        </button>


    </div>



    <!-- =========================================

    ========================================== -->

       <img

        <button

        <button

        <section class="project-panel">

            <h2

            <p
                class="project-intro"

                        <option

                <!-- CONTACT METHOD -->

                <!-- MESSAGE -->

                <!-- SUBMIT -->

            <!-- DIRECT PHONE -->

    <!-- =========================================
         LANGUAGE SYSTEM
    ========================================== -->

    <script>


        /* =========================================
           TRANSLATIONS
        ========================================== */

        const translations = {


            en: {


                staffLogin:
                    "STAFF LOGIN",


                informationLabel:
                    "WEBNANZ // INFORMATION",


                service:
                    "Service",


                informationPlaceholder:
                    "Information will appear here.",


                startProject:
                    "START YOUR PROJECT",


                projectRequestLabel:
                    "WEBNANZ // PROJECT REQUEST",


                letsBuild:
                    "Let's Build Something.",


                projectIntro:
                    "Tell us what you need and WebNanz will get back to you.",


                yourName:
                    "Your Name",


                email:
                    "Email",


                phone:
                    "Phone",


                businessName:
                    "Business Name",


                whatNeed:
                    "What do you need?",


                chooseService:
                    "Choose a service",


                webDesign:
                    "Web Design",


                webDevelopment:
                    "Web Development",


                ecommerce:
                    "E-Commerce",


                mobileExperiences:
                    "Mobile Experiences",


                seoPerformance:
                    "SEO & Performance",


                maintenanceSupport:
                    "Maintenance & Support",


                other:
                    "Other",


                budget:
                    "Budget",


                notSure:
                    "Not sure yet",


                under500:
                    "Under $500",


                preferredContact:
                    "Preferred Contact",


                text:
                    "Text",


                yourMessage:
                    "Your Message",


                messagePlaceholder:
                    "Tell WebNanz about your project...",


                sendMessage:
                    "SEND MESSAGE",


                preferTalk:
                    "Prefer to talk?"


            },



            es: {


                staffLogin:
                    "ACCESO DEL PERSONAL",


                informationLabel:
                    "WEBNANZ // INFORMACIÓN",


                service:
                    "Servicio",


                informationPlaceholder:
                    "La información aparecerá aquí.",


                startProject:
                    "COMIENZA TU PROYECTO",


                projectRequestLabel:
                    "WEBNANZ // SOLICITUD DE PROYECTO",


                letsBuild:
                    "Vamos a Crear Algo.",


                projectIntro:
                    "Cuéntanos qué necesitas y WebNanz se comunicará contigo.",


                yourName:
                    "Tu Nombre",


                email:
                    "Correo Electrónico",


                phone:
                    "Teléfono",


                businessName:
                    "Nombre del Negocio",


                whatNeed:
                    "¿Qué necesitas?",


                chooseService:
                    "Selecciona un servicio",


                webDesign:
                    "Diseño Web",


                webDevelopment:
                    "Desarrollo Web",


                ecommerce:
                    "Comercio Electrónico",


                mobileExperiences:
                    "Experiencias Móviles",


                seoPerformance:
                    "SEO y Rendimiento",


                maintenanceSupport:
                    "Mantenimiento y Soporte",


                other:
                    "Otro",


                budget:
                    "Presupuesto",


                notSure:
                    "Aún no estoy seguro",


                under500:
                    "Menos de $500",


                preferredContact:
                    "Método de Contacto Preferido",


                text:
                    "Mensaje de Texto",


                yourMessage:
                    "Tu Mensaje",


                messagePlaceholder:
                    "Cuéntale a WebNanz sobre tu proyecto...",


                sendMessage:
                    "ENVIAR MENSAJE",


                preferTalk:
                    "¿Prefieres hablar?"


            }


        };



        /* =========================================
           LANGUAGE ELEMENTS
        ========================================== */

        const langEN =
            document.getElementById(
                "langEN"
            );


        const langES =
            document.getElementById(
                "langES"
            );


        const background =
            document.querySelector(
                ".background-image"
            );


        const languageSwitch =
            document.getElementById(
                "languageSwitch"
            );


        const moveLanguageSwitch =
            document.getElementById(
                "moveLanguageSwitch"
            );



        /* =========================================
           CHANGE LANGUAGE
        ========================================== */

        function changeLanguage(
            language
        ) {


            const words =
                translations[
                    language
                ];


            document.documentElement.lang =
                language;



            /* NORMAL TEXT */

            document
                .querySelectorAll(
                    "[data-i18n]"
                )
                .forEach(
                    element => {


                        const key =
                            element.getAttribute(
                                "data-i18n"
                            );


                        if (
                            words[
                                key
                            ] !== undefined
                        ) {


                            element.textContent =
                                words[
                                    key
                                ];


                        }


                    }
                );



            /* PLACEHOLDERS */

            document
                .querySelectorAll(
                    "[data-i18n-placeholder]"
                )
                .forEach(
                    element => {


                        const key =
                            element.getAttribute(
                                "data-i18n-placeholder"
                            );


                        if (
                            words[
                                key
                            ] !== undefined
                        ) {


                            element.placeholder =
                                words[
                                    key
                                ];


                        }


                    }
                );



            /* ACTIVE BUTTON */

            langEN.classList.toggle(
                "active",
                language === "en"
            );


            langES.classList.toggle(
                "active",
                language === "es"
            );



            langEN.setAttribute(
                "aria-pressed",
                String(
                    language ===
                    "en"
                )
            );


            langES.setAttribute(
                "aria-pressed",
                String(
                    language ===
                    "es"
                )
            );



            /* SAVE LANGUAGE */

            localStorage.setItem(
                "webnanzLanguage",
                language
            );



            /* =====================================
               CHANGE BACKGROUND
            ===================================== */

            if (
                background
            ) {


                const englishBackground =
                    background
                        .dataset
                        .bgEn;


                const spanishBackground =
                    background
                        .dataset
                        .bgEs;



                if (
                    language ===
                    "es"
                ) {


                    const tester =
                        new Image();


                    tester.onload =
                        function () {


                            background.src =
                                spanishBackground;


                            background.alt =
                                "Sitio web móvil de WebNanz";


                        };


                    tester.onerror =
                        function () {


                            background.src =
                                englishBackground;


                        };


                    tester.src =
                        spanishBackground;


                }


                else {


                    background.src =
                        englishBackground;


                    background.alt =
                        "WebNanz mobile website";


                }


            }



            /* =====================================
               NOTIFY SCRIPT.JS
            ===================================== */

            window.dispatchEvent(

                new CustomEvent(
                    "webnanz-language-change",
                    {


                        detail: {


                            language:
                                language


                        }


                    }
                )

            );


        }



        /* =========================================
           EN BUTTON
        ========================================== */

        langEN.addEventListener(
            "click",
            function () {


                changeLanguage(
                    "en"
                );


            }
        );



        /* =========================================
           ES BUTTON
        ========================================== */

        langES.addEventListener(
            "click",
            function () {


                changeLanguage(
                    "es"
                );


            }
        );



        /* =========================================
           DRAG LANGUAGE SWITCH
        ========================================== */

        let draggingLanguageSwitch =
            false;


        let dragStartX =
            0;


        let switchStartLeft =
            0;



        /* START DRAG */

        moveLanguageSwitch.addEventListener(
            "pointerdown",
            function (
                event
            ) {


                event.preventDefault();


                draggingLanguageSwitch =
                    true;


                dragStartX =
                    event.clientX;



                const rect =
                    languageSwitch
                        .getBoundingClientRect();



                switchStartLeft =
                    rect.left;



                languageSwitch.style.left =
                    rect.left +
                    "px";


                languageSwitch.style.right =
                    "auto";



                try {


                    moveLanguageSwitch
                        .setPointerCapture(
                            event.pointerId
                        );


                }

                catch (
                    error
                ) {


                    console.log(
                        "Pointer capture unavailable."
                    );


                }


            }
        );



        /* DRAG MOVE */

        moveLanguageSwitch.addEventListener(
            "pointermove",
            function (
                event
            ) {


                if (
                    !draggingLanguageSwitch
                ) {


                    return;


                }



                const distanceMoved =
                    event.clientX -
                    dragStartX;



                let newLeft =
                    switchStartLeft +
                    distanceMoved;



                const minimumLeft =
                    8;



                const maximumLeft =
                    window.innerWidth -
                    languageSwitch.offsetWidth -
                    8;



                newLeft =
                    Math.max(
                        minimumLeft,
                        Math.min(
                            newLeft,
                            maximumLeft
                        )
                    );



                languageSwitch.style.left =
                    newLeft +
                    "px";


                languageSwitch.style.right =
                    "auto";


            }
        );



        /* STOP DRAG */

        function stopLanguageDrag(
            event
        ) {


            if (
                !draggingLanguageSwitch
            ) {


                return;


            }



            draggingLanguageSwitch =
                false;



            const rect =
                languageSwitch
                    .getBoundingClientRect();



            localStorage.setItem(
                "webnanzLanguageSwitchX",
                String(
                    rect.left
                )
            );



            try {


                moveLanguageSwitch
                    .releasePointerCapture(
                        event.pointerId
                    );


            }

            catch (
                error
            ) {


                /* nothing needed */


            }


        }



        moveLanguageSwitch.addEventListener(
            "pointerup",
            stopLanguageDrag
        );


        moveLanguageSwitch.addEventListener(
            "pointercancel",
            stopLanguageDrag
        );



        /* =========================================
           RESTORE SAVED SWITCH POSITION
        ========================================== */

        const savedSwitchX =
            localStorage.getItem(
                "webnanzLanguageSwitchX"
            );


        if (
            savedSwitchX !==
            null
        ) {


            let savedLeft =
                Number(
                    savedSwitchX
                );



            const maximumLeft =
                Math.max(

                    8,

                    window.innerWidth -
                    languageSwitch.offsetWidth -
                    8

                );



            savedLeft =
                Math.max(

                    8,

                    Math.min(
                        savedLeft,
                        maximumLeft
                    )

                );



            languageSwitch.style.left =
                savedLeft +
                "px";


            languageSwitch.style.right =
                "auto";


        }



        /* =========================================
           KEEP SWITCH ON SCREEN
        ========================================== */

        window.addEventListener(
            "resize",
            function () {


                const rect =
                    languageSwitch
                        .getBoundingClientRect();



                const maximumLeft =
                    Math.max(

                        8,

                        window.innerWidth -
                        languageSwitch.offsetWidth -
                        8

                    );



                let newLeft =
                    rect.left;



                if (
                    newLeft >
                    maximumLeft
                ) {


                    newLeft =
                        maximumLeft;


                }



                if (
                    newLeft <
                    8
                ) {


                    newLeft =
                        8;


                }



                languageSwitch.style.left =
                    newLeft +
                    "px";


                languageSwitch.style.right =
                    "auto";


            }
        );



        /* =========================================
           RESTORE LANGUAGE
        ========================================== */

        const savedLanguage =
            localStorage.getItem(
                "webnanzLanguage"
            );


        if (
            savedLanguage ===
            "es"
        ) {


            changeLanguage(
                "es"
            );


        }

        else {


            changeLanguage(
                "en"
            );


        }



        /* =========================================
           EXPOSE LANGUAGE TO SCRIPT.JS
        ========================================== */

        window.WebNanzLanguage = {


            changeLanguage:
                changeLanguage,


            getLanguage:
                function () {


                    return (

                        localStorage.getItem(
                            "webnanzLanguage"
                        ) ||
                        "en"

                    );


                },


            translations:
                translations


        };


    </script>
