<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>WebNanz</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .language-switch {
            position: fixed;
            top: 16px;
            right: 16px;
            z-index: 99999;
            display: flex;
            gap: 6px;
            padding: 6px;
            border: 1px solid rgba(0, 238, 255, 0.6);
            border-radius: 999px;
            background: rgba(5, 8, 24, 0.88);
            backdrop-filter: blur(10px);
            box-shadow:
                0 0 12px rgba(0, 238, 255, 0.35),
                0 0 22px rgba(204, 0, 255, 0.18);
        }

        .language-button {
            min-width: 44px;
            border: 0;
            border-radius: 999px;
            padding: 8px 11px;
            cursor: pointer;
            font: inherit;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            color: #dffcff;
            background: transparent;
        }

        .language-button.active {
            color: #050818;
            background: linear-gradient(135deg, #00f0ff, #d946ef);
            box-shadow: 0 0 12px rgba(0, 240, 255, 0.55);
        }
    </style>
</head>

<body>

    <div class="language-switch" role="group" aria-label="Language selector">
        <button
            type="button"
            class="language-button active"
            id="langEN"
            aria-pressed="true">
            EN
        </button>

        <button
            type="button"
            class="language-button"
            id="langES"
            aria-pressed="false">
            ES
        </button>
    </div>

    <main class="mobile-site">

        <img
            src="assets/images/webcraft-mobile-bg.png"
            data-bg-en="assets/images/webcraft-mobile-bg.png"
            data-bg-es="assets/images/webcraft-mobile-bg-es.png"
            alt="WebNanz mobile website"
            class="background-image"
        >

        <!-- START YOUR PROJECT -->
        <button
            class="hotspot start-project"
            id="startProjectButton"
            data-action="project"
            aria-label="Start your project">
        </button>

        <!-- SERVICES -->
        <button
            class="hotspot service web-design"
            data-service="web-design"
            aria-label="Web Design">
        </button>

        <button
            class="hotspot service web-development"
            data-service="web-development"
            aria-label="Web Development">
        </button>

        <button
            class="hotspot service ecommerce"
            data-service="ecommerce"
            aria-label="E-Commerce">
        </button>

        <button
            class="hotspot service mobile-experiences"
            data-service="mobile-experiences"
            aria-label="Mobile Experiences">
        </button>

        <button
            class="hotspot service seo"
            data-service="seo"
            aria-label="SEO and Performance">
        </button>

        <button
            class="hotspot service maintenance"
            data-service="maintenance"
            aria-label="Maintenance and Support">
        </button>

        <!-- PROCESS -->
        <button
            class="hotspot process consult"
            data-process="consult"
            aria-label="Consult">
        </button>

        <button
            class="hotspot process design"
            data-process="design"
            aria-label="Design">
        </button>

        <button
            class="hotspot process build"
            data-process="build"
            aria-label="Build">
        </button>

        <button
            class="hotspot process launch"
            data-process="launch"
            aria-label="Launch">
        </button>

        <!-- CONTACT BUTTONS -->

        <a
            class="hotspot contact whatsapp"
            href="https://wa.me/17876314646"
            target="_blank"
            aria-label="WhatsApp WebNanz">
        </a>

        <a
            class="hotspot contact phone"
            href="tel:+17876314646"
            aria-label="Call WebNanz">
        </a>

        <button
            class="hotspot contact email"
            id="messageButton"
            aria-label="Message WebNanz">
        </button>

        <!-- STAFF LOGIN -->

        <a
            href="staff-login.html"
            class="staff-login-link"
            data-i18n="staffLogin">
            STAFF LOGIN
        </a>

    </main>

    <!-- INFORMATION PANEL -->

    <div class="info-modal" id="infoModal">

        <div
            class="modal-backdrop"
            id="modalBackdrop">
        </div>

        <section class="info-panel">

            <button
                class="close-modal"
                id="closeModal"
                aria-label="Close">
                ×
            </button>

            <p
                class="system-label"
                data-i18n="informationLabel">
                WEBNANZ // INFORMATION
            </p>

            <h2
                id="modalTitle"
                data-i18n="service">
                Service
            </h2>

            <p
                id="modalText"
                data-i18n="informationPlaceholder">
                Information will appear here.
            </p>

            <div id="modalFeatures"></div>

            <button
                class="modal-project-button"
                id="modalProjectButton"
                data-i18n="startProject">
                START YOUR PROJECT
            </button>

        </section>

    </div>

    <!-- CUSTOMER MESSAGE / PROJECT FORM -->

    <div
        class="project-modal"
        id="projectModal">

        <div
            class="project-backdrop"
            id="projectBackdrop">
        </div>

        <section class="project-panel">

            <button
                class="project-close"
                id="projectClose"
                aria-label="Close">
                ×
            </button>

            <p
                class="system-label"
                data-i18n="projectRequestLabel">
                WEBNANZ // PROJECT REQUEST
            </p>

            <h2 data-i18n="letsBuild">
                Let's Build Something.
            </h2>

            <p
                class="project-intro"
                data-i18n="projectIntro">
                Tell us what you need and WebNanz will get back to you.
            </p>

            <form id="projectForm">

                <div class="form-group">

                    <label
                        for="customerName"
                        data-i18n="yourName">
                        Your Name
                    </label>

                    <input
                        type="text"
                        id="customerName"
                        required>
                </div>

                <div class="form-group">

                    <label
                        for="customerEmail"
                        data-i18n="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="customerEmail"
                        required>
                </div>

                <div class="form-group">

                    <label
                        for="customerPhone"
                        data-i18n="phone">
                        Phone
                    </label>

                    <input
                        type="tel"
                        id="customerPhone">
                </div>

                <div class="form-group">

                    <label
                        for="businessName"
                        data-i18n="businessName">
                        Business Name
                    </label>

                    <input
                        type="text"
                        id="businessName">
                </div>

                <div class="form-group">

                    <label
                        for="projectType"
                        data-i18n="whatNeed">
                        What do you need?
                    </label>

                    <select
                        id="projectType"
                        required>

                        <option
                            value=""
                            data-i18n="chooseService">
                            Choose a service
                        </option>

                        <option
                            value="Web Design"
                            data-i18n="webDesign">
                            Web Design
                        </option>

                        <option
                            value="Web Development"
                            data-i18n="webDevelopment">
                            Web Development
                        </option>

                        <option
                            value="E-Commerce"
                            data-i18n="ecommerce">
                            E-Commerce
                        </option>

                        <option
                            value="Mobile Experiences"
                            data-i18n="mobileExperiences">
                            Mobile Experiences
                        </option>

                        <option
                            value="SEO & Performance"
                            data-i18n="seoPerformance">
                            SEO & Performance
                        </option>

                        <option
                            value="Maintenance & Support"
                            data-i18n="maintenanceSupport">
                            Maintenance & Support
                        </option>

                        <option
                            value="Other"
                            data-i18n="other">
                            Other
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label
                        for="budget"
                        data-i18n="budget">
                        Budget
                    </label>

                    <select id="budget">

                        <option
                            value="Not sure"
                            data-i18n="notSure">
                            Not sure yet
                        </option>

                        <option
                            value="Under $500"
                            data-i18n="under500">
                            Under $500
                        </option>

                        <option value="$500-$1,000">
                            $500 - $1,000
                        </option>

                        <option value="$1,000-$2,500">
                            $1,000 - $2,500
                        </option>

                        <option value="$2,500+">
                            $2,500+
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label
                        for="preferredContact"
                        data-i18n="preferredContact">
                        Preferred Contact
                    </label>

                    <select id="preferredContact">

                        <option
                            value="Phone"
                            data-i18n="phone">
                            Phone
                        </option>

                        <option
                            value="Text"
                            data-i18n="text">
                            Text
                        </option>

                        <option
                            value="Email"
                            data-i18n="email">
                            Email
                        </option>

                        <option value="WhatsApp">
                            WhatsApp
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label
                        for="customerMessage"
                        data-i18n="yourMessage">
                        Your Message
                    </label>

                    <textarea
                        id="customerMessage"
                        rows="6"
                        required
                        placeholder="Tell WebNanz about your project..."
                        data-i18n-placeholder="messagePlaceholder"></textarea>

                </div>

                <button
                    type="submit"
                    class="submit-project"
                    data-i18n="sendMessage">
                    SEND MESSAGE
                </button>

                <p
                    class="form-status"
                    id="formStatus">
                </p>

            </form>

            <div class="direct-contact">

                <p data-i18n="preferTalk">
                    Prefer to talk?
                </p>

                <a href="tel:+17876314646">
                    (787) 631-4646
                </a>

            </div>

        </section>

    </div>

    <!-- LANGUAGE SYSTEM -->

    <script>

        const translations = {

            en: {

                staffLogin: "STAFF LOGIN",

                informationLabel:
                "WEBNANZ // INFORMATION",

                service:
                "Service",

                informationPlaceholder:
                "Information will appear here.",

                startProject:
                "START YOUR PROJECT",

                projectRequestLabel:
                "WEBNANZ // PROJECT REQUEST",

                letsBuild:
                "Let's Build Something.",

                projectIntro:
                "Tell us what you need and WebNanz will get back to you.",

                yourName:
                "Your Name",

                email:
                "Email",

                phone:
                "Phone",

                businessName:
                "Business Name",

                whatNeed:
                "What do you need?",

                chooseService:
                "Choose a service",

                webDesign:
                "Web Design",

                webDevelopment:
                "Web Development",

                ecommerce:
                "E-Commerce",

                mobileExperiences:
                "Mobile Experiences",

                seoPerformance:
                "SEO & Performance",

                maintenanceSupport:
                "Maintenance & Support",

                other:
                "Other",

                budget:
                "Budget",

                notSure:
                "Not sure yet",

                under500:
                "Under $500",

                preferredContact:
                "Preferred Contact",

                text:
                "Text",

                yourMessage:
                "Your Message",

                messagePlaceholder:
                "Tell WebNanz about your project...",

                sendMessage:
                "SEND MESSAGE",

                preferTalk:
                "Prefer to talk?"

            },

            es: {

                staffLogin:
                "ACCESO DEL PERSONAL",

                informationLabel:
                "WEBNANZ // INFORMACIÓN",

                service:
                "Servicio",

                informationPlaceholder:
                "La información aparecerá aquí.",

                startProject:
                "COMIENZA TU PROYECTO",

                projectRequestLabel:
                "WEBNANZ // SOLICITUD DE PROYECTO",

                letsBuild:
                "Vamos a Crear Algo.",

                projectIntro:
                "Cuéntanos qué necesitas y WebNanz se comunicará contigo.",

                yourName:
                "Tu Nombre",

                email:
                "Correo Electrónico",

                phone:
                "Teléfono",

                businessName:
                "Nombre del Negocio",

                whatNeed:
                "¿Qué necesitas?",

                chooseService:
                "Selecciona un servicio",

                webDesign:
                "Diseño Web",

                webDevelopment:
                "Desarrollo Web",

                ecommerce:
                "Comercio Electrónico",

                mobileExperiences:
                "Experiencias Móviles",

                seoPerformance:
                "SEO y Rendimiento",

                maintenanceSupport:
                "Mantenimiento y Soporte",

                other:
                "Otro",

                budget:
                "Presupuesto",

                notSure:
                "Aún no estoy seguro",

                under500:
                "Menos de $500",

                preferredContact:
                "Método de Contacto Preferido",

                text:
                "Mensaje de Texto",

                yourMessage:
                "Tu Mensaje",

                messagePlaceholder:
                "Cuéntale a WebNanz sobre tu proyecto...",

                sendMessage:
                "ENVIAR MENSAJE",

                preferTalk:
                "¿Prefieres hablar?"

            }

        };

        const langEN =
        document.getElementById("langEN");

        const langES =
        document.getElementById("langES");

        const background =
        document.querySelector(".background-image");

        function changeLanguage(language) {

            const words =
            translations[language];

            document.documentElement.lang =
            language;

            document
            .querySelectorAll("[data-i18n]")
            .forEach(element => {

                const translationKey =
                element.getAttribute("data-i18n");

                if (
                    words[translationKey] !== undefined
                ) {

                    element.textContent =
                    words[translationKey];

                }

            });

            document
            .querySelectorAll(
                "[data-i18n-placeholder]"
            )
            .forEach(element => {

                const translationKey =
                element.getAttribute(
                    "data-i18n-placeholder"
                );

                if (
                    words[translationKey] !== undefined
                ) {

                    element.placeholder =
                    words[translationKey];

                }

            });

            langEN.classList.toggle(
                "active",
                language === "en"
            );

            langES.classList.toggle(
                "active",
                language === "es"
            );

            langEN.setAttribute(
                "aria-pressed",
                String(language === "en")
            );

            langES.setAttribute(
                "aria-pressed",
                String(language === "es")
            );

            localStorage.setItem(
                "webnanzLanguage",
                language
            );

            if (background) {

                const englishBackground =
                background.dataset.bgEn;

                const spanishBackground =
                background.dataset.bgEs;

                if (
                    language === "es" &&
                    spanishBackground
                ) {

                    const tester =
                    new Image();

                    tester.onload =
                    function () {

                        background.src =
                        spanishBackground;

                    };

                    tester.onerror =
                    function () {

                        background.src =
                        englishBackground;

                    };

                    tester.src =
                    spanishBackground;

                }

                else {

                    background.src =
                    englishBackground;

                }

            }

            window.dispatchEvent(

                new CustomEvent(
                    "webnanz-language-change",
                    {

                        detail: {
                            language: language
                        }

                    }
                )

            );

        }

        langEN.addEventListener(
            "click",
            function () {

                changeLanguage("en");

            }
        );

        langES.addEventListener(
            "click",
            function () {

                changeLanguage("es");

            }
        );

        const savedLanguage =
        localStorage.getItem(
            "webnanzLanguage"
        );

        if (savedLanguage === "es") {

            changeLanguage("es");

        }

        else {

            changeLanguage("en");

        }

        window.WebNanzLanguage = {

            changeLanguage:
            changeLanguage,

            getLanguage:
            function () {

                return (
                    localStorage.getItem(
                        "webnanzLanguage"
                    ) || "en"
                );

            },

            translations:
            translations

        };

    </script>

    <script src="script.js"></script>

    <script
        type="module"
        src="contact.js">
    </script>

</body>
</html>
